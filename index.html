<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="container">
        <h1>Formulário de Cadastro</h1>
        
        <form id="formCadastro">
            <!-- Campo Nome — sem validação -->
            <div class="grupo-campo">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome">
            </div>

            <!-- Campo Telefone -->
            <div class="grupo-campo">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" name="telefone" placeholder="(00) 00000-0000">
                <span class="erro" id="erro-telefone"></span>
            </div>

            <!-- Campo E-mail -->
            <div class="grupo-campo">
                <label for="email">E-mail</label>
                <input type="text" id="email" name="email" placeholder="seuemail@exemplo.com">
                <span class="erro" id="erro-email"></span>
            </div>

            <!-- Campo CPF -->
            <div class="grupo-campo">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00">
                <span class="erro" id="erro-cpf"></span>
            </div>

            <!-- Campo Data de Nascimento -->
            <div class="grupo-campo">
                <label for="nascimento">Data de Nascimento</label>
                <input type="text" id="nascimento" name="nascimento" placeholder="DD/MM/AAAA">
                <span class="erro" id="erro-nascimento"></span>
            </div>

            <!-- Botões -->
            <div class="botoes">
                <button type="reset" class="btn-cancelar">Cancelar</button>
                <button type="submit" class="btn-enviar">Realizar inscrição</button>
            </div>
        </form>
    </div>

    <script src="validacao.js"></script>
</body>
</html>
